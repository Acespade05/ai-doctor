services:
  doctor:
    build: .
    container_name: ai-sre-doctor
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Persist the ChromaDB embedding model (~79MB) across rebuilds so it
      # downloads only once, not on every `docker compose up --build`.
      - chroma_model_cache:/root/.cache
    restart: unless-stopped

volumes:
  chroma_model_cache:
